<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tilted Solar System</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="solar-system">
    <!-- Sun -->
    <div class="sun">
      <span class="label label-sun">Sun</span>
    </div>

    <!-- Mercury -->v
    <div class="orbit orbit1">
      <div class="planet planet1">
        <span class="label label1">Mercury</span>
      </div>
    </div>

    <!-- Venus -->
    <div class="orbit orbit2">
      <div class="planet planet2">
        <span class="label label2">Venus</span>
      </div>
    </div>

    <!-- Earth -->
    <div class="orbit orbit3">
      <div class="planet planet3">
        <span class="label label3">Earth</span>
      </div>
    </div>

    <!-- Mars -->
    <div class="orbit orbit4">
      <div class="planet planet4">
        <span class="label label4">Mars</span>
      </div>
    </div>

    <!-- Jupiter -->
    <div class="orbit orbit5">
      <div class="planet planet5">
        <span class="label label5">Jupiter</span>
      </div>
    </div>

    <!-- Saturn -->
    <div class="orbit orbit6">
      <div class="planet planet6">
        <span class="label label6">Saturn</span>
      </div>
    </div>

    <!-- Uranus -->
    <div class="orbit orbit7">
      <div class="planet planet7">
        <span class="label label7">Uranus</span>
      </div>
    </div>

    <!-- Neptune -->
    <div class="orbit orbit8">
      <div class="planet planet8">
        <span class="label label8">Neptune</span>
      </div>
    </div>
  </div>

</body>
</html>
